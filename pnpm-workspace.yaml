packages:
  - apps/web
  - apps/gateway
  - packages/*
  # The Expo apps (apps/tv, apps/ios) are intentionally NOT part of the shared
  # install: React Native and Metro want a flat, hoisted node_modules and their
  # own React / @types/react versions, which break the web app's typecheck and
  # its `sharp` native build when the store is shared. Each is installed on its
  # own (cd apps/<app> && pnpm install), hoisted flat by its own
  # pnpm-workspace.yaml.

# OwnTube: the web app and its YouTube gateway.
# Set GATEWAY_SIGNING_KEY (openssl rand -base64 48) and AUTH_SECRET in .env.
# Behind a reverse proxy, route /media/* straight to the gateway (port 8080);
# without one the web app forwards it.
services:
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      DATABASE_PATH: /app/apps/web/data/owntube.db
      GATEWAY_URL: http://gateway:8080
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:?set GATEWAY_SIGNING_KEY in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      OWNTUBE_WARM_INTERVAL_SEC: ${OWNTUBE_WARM_INTERVAL_SEC:-900}
      OWNTUBE_WARM_REGION: ${OWNTUBE_WARM_REGION:-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - owntube-data:/app/apps/web/data

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:?set GATEWAY_SIGNING_KEY in .env}
      # YouTube flags whole IPv6 /64s faster than IPv4 addresses.
      GATEWAY_EGRESS_FAMILY: ${GATEWAY_EGRESS_FAMILY:-ipv4}
      GATEWAY_CACHE_DIR: /data/cache
    volumes:
      - owntube-gateway:/data

volumes:
  owntube-data:
  owntube-gateway:

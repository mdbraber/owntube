# OwnTube on Unraid: see "Unraid" in docs/SELF-HOSTING.md.
#   docker compose -f docker-compose.unraid.yml --env-file .env.unraid up -d --build
# .env.unraid only fills in the variables listed below.
services:
  app:
    container_name: owntube
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      DATABASE_PATH: /app/apps/web/data/owntube.db
      GATEWAY_URL: http://owntube-gateway:8080
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:?set GATEWAY_SIGNING_KEY in .env.unraid}
      OWNTUBE_DEBUG_RECOMMENDATIONS: ${OWNTUBE_DEBUG_RECOMMENDATIONS:-}
      # Optional: unset values reach the app as empty strings and mean "default".
      GATEWAY_PLAYBACK_TTL_SEC: ${GATEWAY_PLAYBACK_TTL_SEC:-}
      OWNTUBE_WARM_INTERVAL_SEC: ${OWNTUBE_WARM_INTERVAL_SEC:-900}
      OWNTUBE_WARM_REGION: ${OWNTUBE_WARM_REGION:-US}
      OWNTUBE_WARM_LIMIT: ${OWNTUBE_WARM_LIMIT:-}
      OWNTUBE_WARM_CHANNELS: ${OWNTUBE_WARM_CHANNELS:-}
      OWNTUBE_WARM_CHANNEL_PAGES: ${OWNTUBE_WARM_CHANNEL_PAGES:-}
      OWNTUBE_WARM_SHORTS: ${OWNTUBE_WARM_SHORTS:-}
      OWNTUBE_WARM_RECENCY: ${OWNTUBE_WARM_RECENCY:-}
      OWNTUBE_WARM_RSS: ${OWNTUBE_WARM_RSS:-}
      OWNTUBE_WARM_VIDEOS: ${OWNTUBE_WARM_VIDEOS:-}
      OWNTUBE_WARM_VIDEO_LIMIT: ${OWNTUBE_WARM_VIDEO_LIMIT:-}
      OWNTUBE_WARM_HOME: ${OWNTUBE_WARM_HOME:-}
      OWNTUBE_WARM_HISTORY_CHANNELS: ${OWNTUBE_WARM_HISTORY_CHANNELS:-}
      OWNTUBE_WARM_SUBSCRIPTION_CHANNELS: ${OWNTUBE_WARM_SUBSCRIPTION_CHANNELS:-}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.unraid}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: "${AUTH_URL:?set AUTH_URL in .env.unraid (example: http://192.168.1.11:3000)}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: ${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - /mnt/user/appdata/owntube/data:/app/apps/web/data

  gateway:
    container_name: owntube-gateway
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:?set GATEWAY_SIGNING_KEY in .env.unraid}
      GATEWAY_EGRESS_FAMILY: ${GATEWAY_EGRESS_FAMILY:-ipv4}
      GATEWAY_CACHE_DIR: /data/cache
      # Optional: unset values reach the gateway as empty strings and mean "default".
      GATEWAY_TRANSPORT: ${GATEWAY_TRANSPORT:-}
      GATEWAY_PROXY_URL: ${GATEWAY_PROXY_URL:-}
      GATEWAY_IMAGE_CACHE_MAX_BYTES: ${GATEWAY_IMAGE_CACHE_MAX_BYTES:-}
      # Needs an image built with --build-arg WITH_PO_BROWSER=true.
      GATEWAY_PO_BROWSER: ${GATEWAY_PO_BROWSER:-}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - /mnt/user/appdata/owntube/gateway:/data

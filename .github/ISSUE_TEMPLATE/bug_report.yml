name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: |
        I tried to ...
        I expected ...
        Instead ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the issue.
      placeholder: |
        1. Go to /search
        2. Type "..."
        3. Click ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OwnTube version / commit
      placeholder: v0.1.0 or commit hash
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v24.x
    validations:
      required: true

  - type: dropdown
    id: egress
    attributes:
      label: Gateway egress
      description: GATEWAY_EGRESS_FAMILY (how the gateway reaches YouTube).
      options:
        - ipv4
        - ipv6
        - auto
        - Through a proxy (GATEWAY_PROXY_URL)
    validations:
      required: true

  - type: textarea
    id: gateway-log
    attributes:
      label: Gateway log
      description: The gateway's output around the failure (`docker logs owntube-gateway`), no secrets.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `LOG_LEVEL=debug` and paste any relevant output here.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched the existing issues
          required: true
        - label: I am not running an outdated commit
          required: true

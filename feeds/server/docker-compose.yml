# Deploy on spiff, publishing owntube.nedworks.org.
#
# This uses the caddy-docker-proxy label style (as the home OwnTube compose
# does). Adjust the label PREFIX and the external network NAME to match spiff's
# actual Caddy setup — on a public host the cert is public (Let's Encrypt), so
# there's no `import tls_home`; Caddy provisions it automatically.
services:
  owntube-feeds-server:
    container_name: owntube-feeds-server
    hostname: owntube-feeds-server
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      PUBLISH_SECRET: ${PUBLISH_SECRET:?set PUBLISH_SECRET in .env}
      # Feed Basic Auth is per user: credentials arrive with each publish
      # (username + SHA-256 of the RSS pass from OwnTube's user settings).
      # Optional /publish IP allow-list (defense-in-depth atop PUBLISH_SECRET).
      PUBLISH_ALLOW_HOSTS: ${PUBLISH_ALLOW_HOSTS:-}
      PUBLISH_ALLOW_IPS: ${PUBLISH_ALLOW_IPS:-}
      # WebSub hub (optional; on when all three are set). See ../hub/README.md.
      HUB_URL: ${HUB_URL:-}
      HUB_PUBLISH_URL: ${HUB_PUBLISH_URL:-}
      HUB_PUBLISH_TOKEN: ${HUB_PUBLISH_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # WebSub push for YouTube uploads (see README). Empty turns it off.
      WEBSUB_CALLBACK_URL: ${WEBSUB_CALLBACK_URL-https://owntube.nedworks.org/websub/callback}
      # Optional overrides; empty means Google's hub / a secret derived from PUBLISH_SECRET.
      WEBSUB_HUB_URL: ${WEBSUB_HUB_URL:-}
      WEBSUB_SECRET: ${WEBSUB_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # Bind mount, not a named volume: the data sits beside the compose file so
      # it can be listed, backed up and rsynced like anything else on the host.
      # Matches the other stacks here (pocket-sessions uses ./data:/data too).
      - ./data:/data
    networks:
      - caddy
    labels:
      # caddy-docker-proxy (spiff): join the external `caddy` network, no authelia
      # import — the feeds server does its own HTTP Basic Auth (an auth portal
      # would break podcast-client credentials).
      caddy: "owntube.nedworks.org"
      caddy.reverse_proxy: "* {{upstreams 8080}}"

networks:
  caddy:
    external: true
